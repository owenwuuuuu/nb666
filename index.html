
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#faf9f6">
  <title>2048 — Smooth Edition</title>

  <style>
    :root {
      --background: #faf9f6;
      --text: #302d29;
      --muted: #99948e;
      --board: #b9ada0;
      --empty: #cdc2b5;
      --gap: 10px;
      --padding: 10px;
      --move-duration: 170ms;
      --tile-radius: 17px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .game {
      width: min(92vw, 430px);
      padding: 28px 0;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 22px;
    }

    .logo {
      margin: 0;
      font-size: 58px;
      font-weight: 850;
      letter-spacing: -4px;
      line-height: 1;
    }

    .logo span {
      color: #d5a45e;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .scores {
      display: flex;
      gap: 8px;
    }

    .score-card {
      min-width: 82px;
      padding: 10px 12px;
      border: 1px solid #ebe8e3;
      border-radius: 15px;
      background: #fff;
      text-align: center;
    }

    .score-card small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
    }

    .score-card strong {
      font-size: 23px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .description {
      margin: 0;
      color: #817b74;
      font-size: 13px;
    }

    .actions {
      display: flex;
      gap: 8px;
    }

    button {
      border: 1px solid #e9e4de;
      border-radius: 12px;
      padding: 10px 13px;
      background: #fff;
      color: #514b45;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 150ms, transform 150ms;
    }

    button:hover {
      background: #f1ece6;
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 3px solid #d5a45e;
      outline-offset: 3px;
    }

    .board {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 25px;
      background: var(--board);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      outline: none;
    }

    .cell,
    .tile {
      position: absolute;
      width: var(--cell-size);
      height: var(--cell-size);
      border-radius: var(--tile-radius);
    }

    .cell {
      background: var(--empty);
    }

    .tile {
      left: 0;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 4px #5a463014;
      will-change: transform;
      transition: transform var(--move-duration)
        cubic-bezier(0.22, 0.8, 0.25, 1);
    }

    .tile-face {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: inherit;
    }

    .tile.spawn .tile-face {
      animation: spawn 220ms ease-out both;
    }

    .tile.merge .tile-face {
      animation: merge 240ms ease-out;
    }

    @keyframes spawn {
      0% {
        opacity: 0;
        transform: scale(0.35);
      }
      70% {
        opacity: 1;
        transform: scale(1.07);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes merge {
      0% {
        transform: scale(1);
      }
      45% {
        transform: scale(1.16);
      }
      100% {
        transform: scale(1);
      }
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      border-radius: 25px;
      background: #faf8efdf;
      color: #776e65;
      font-size: 30px;
      font-weight: 800;
      text-align: center;
    }

    .overlay button {
      padding: 12px 20px;
      border: none;
      background: #8f7a66;
      color: white;
      font-size: 14px;
    }

    .footer {
      margin-top: 22px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      line-height: 1.8;
    }

    @media (max-width: 390px) {
      .logo {
        font-size: 47px;
      }

      .score-card {
        min-width: 68px;
        padding: 8px;
      }

      .score-card strong {
        font-size: 20px;
      }

      .description {
        font-size: 11px;
      }

      button {
        padding: 9px 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .tile {
        transition-duration: 0ms;
      }

      .tile.spawn .tile-face,
      .tile.merge .tile-face {
        animation: none;
      }
    }
  </style>
</head>

<body>
  <main class="game">
    <header class="header">
      <div>
        <h1 class="logo">2048<span>.</span></h1>
        <div class="subtitle">SMOOTH EDITION</div>
      </div>

      <div class="scores">
        <div class="score-card">
          <small>SCORE</small>
          <strong id="score">0</strong>
        </div>
        <div class="score-card">
          <small>BEST</small>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <p class="description">Join tiles. Reach 2048.</p>

      <div class="actions">
        <button id="undo" type="button">Undo</button>
        <button id="restart" type="button">New Game</button>
      </div>
    </div>

    <div
      id="board"
      class="board"
      tabindex="0"
      role="application"
      aria-label="2048 game board">
    </div>

    <footer class="footer">
      Use arrow keys or WASD to move tiles.
      <div>Swipe to play on mobile.</div>
    </footer>
  </main>

  <script>
    "use strict";

    class Game2048 {
      constructor() {
        this.boardEl = document.getElementById("board");
        this.scoreEl = document.getElementById("score");
        this.bestEl = document.getElementById("best");

        this.size = 4;
        this.gap = 10;
        this.padding = 10;
        this.duration = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches ? 0 : 170;

        this.colors = {
          2:    ["#eee4da", "#776e65"],
          4:    ["#ede0c8", "#776e65"],
          8:    ["#f2b179", "#ffffff"],
          16:   ["#f59563", "#ffffff"],
          32:   ["#f67c5f", "#ffffff"],
          64:   ["#f65e3b", "#ffffff"],
          128:  ["#edcf72", "#ffffff"],
          256:  ["#edcc61", "#ffffff"],
          512:  ["#edc850", "#ffffff"],
          1024: ["#edc53f", "#ffffff"],
          2048: ["#edc22e", "#ffffff"]
        };

        this.tiles = [];
        this.score = 0;
        this.best = this.loadBest();
        this.previous = null;
        this.busy = false;
        this.won = false;
        this.over = false;
        this.keepPlaying = false;
        this.nextId = 0;
        this.pendingDirection = null;
        this.generation = 0;

        this.bindEvents();
        this.newGame();
      }

      loadBest() {
        try {
          return Number(
            localStorage.getItem("2048-smooth-best")
          ) || 0;
        } catch {
          return 0;
        }
      }

      saveBest() {
        try {
          localStorage.setItem(
            "2048-smooth-best",
            String(this.best)
          );
        } catch {}
      }

      get cellSize() {
        return (
          this.boardEl.clientWidth -
          this.padding * 2 -
          this.gap * 3
        ) / 4;
      }

      position(row, col) {
        const step = this.cellSize + this.gap;

        return {
          x: this.padding + col * step,
          y: this.padding + row * step
        };
      }

      setPosition(tile) {
        const { x, y } = this.position(tile.row, tile.col);

        tile.node.style.transform =
          `translate3d(${x}px, ${y}px, 0)`;
      }

      drawBackground() {
        this.boardEl.replaceChildren();

        this.boardEl.style.setProperty(
          "--cell-size",
          `${this.cellSize}px`
        );

        for (let row = 0; row < 4; row++) {
          for (let col = 0; col < 4; col++) {
            const cell = document.createElement("div");
            cell.className = "cell";

            const { x, y } = this.position(row, col);

            cell.style.left = `${x}px`;
            cell.style.top = `${y}px`;

            this.boardEl.appendChild(cell);
          }
        }
      }

      styleTile(tile) {
        const [background, color] =
          this.colors[tile.value] ||
          ["#3c3a32", "#ffffff"];

        tile.node.style.background = background;
        tile.node.style.color = color;

        const ratio =
          tile.value >= 1024 ? 0.27 :
          tile.value >= 128 ? 0.34 : 0.43;

        tile.node.style.fontSize =
          `${Math.max(15, this.cellSize * ratio)}px`;

        tile.node.querySelector(".tile-face")
          .textContent = tile.value;
      }

      createTile(tile, animate = false) {
        const node = document.createElement("div");
        const face = document.createElement("div");

        node.className = "tile";
        face.className = "tile-face";

        node.appendChild(face);
        tile.node = node;

        this.styleTile(tile);
        this.setPosition(tile);

        if (animate && this.duration > 0) {
          node.classList.add("spawn");
        }

        this.boardEl.appendChild(node);
      }

      spawnTile(animate = true) {
        const occupied = new Set(
          this.tiles.map(t => t.row * 4 + t.col)
        );

        const empty = [];

        for (let i = 0; i < 16; i++) {
          if (!occupied.has(i)) empty.push(i);
        }

        if (!empty.length) return;

        const index =
          empty[Math.floor(Math.random() * empty.length)];

        const tile = {
          id: ++this.nextId,
          row: Math.floor(index / 4),
          col: index % 4,
          value: Math.random() < 0.9 ? 2 : 4,
          node: null
        };

        this.tiles.push(tile);
        this.createTile(tile, animate);
      }

      updateScore() {
        this.scoreEl.textContent = this.score;

        if (this.score > this.best) {
          this.best = this.score;
          this.saveBest();
        }

        this.bestEl.textContent = this.best;
      }

      newGame() {
        this.generation++;
        this.tiles = [];
        this.score = 0;
        this.previous = null;
        this.busy = false;
        this.won = false;
        this.over = false;
        this.keepPlaying = false;
        this.pendingDirection = null;

        this.drawBackground();
        this.spawnTile(false);
        this.spawnTile(false);
        this.updateScore();
      }

      getGrid() {
        const grid = Array(16).fill(0);

        for (const tile of this.tiles) {
          grid[tile.row * 4 + tile.col] = tile.value;
        }

        return grid;
      }

      canMove() {
        const grid = this.getGrid();

        if (grid.includes(0)) return true;

        for (let i = 0; i < 16; i++) {
          const right =
            i % 4 < 3 && grid[i] === grid[i + 1];

          const down =
            i < 12 && grid[i] === grid[i + 4];

          if (right || down) return true;
        }

        return false;
      }

      getLine(direction, index) {
        const horizontal =
          direction === "left" || direction === "right";

        return this.tiles
          .filter(tile =>
            horizontal
              ? tile.row === index
              : tile.col === index
          )
          .sort((a, b) => {
            switch (direction) {
              case "left": return a.col - b.col;
              case "right": return b.col - a.col;
              case "up": return a.row - b.row;
              case "down": return b.row - a.row;
            }
          });
      }

      targetPosition(direction, line, index) {
        switch (direction) {
          case "left":
            return { row: line, col: index };
          case "right":
            return { row: line, col: 3 - index };
          case "up":
            return { row: index, col: line };
          case "down":
            return { row: 3 - index, col: line };
        }
      }

      move(direction) {
        if (this.busy) {
          this.pendingDirection = direction;
          return;
        }

        if (this.over ||
            (this.won && !this.keepPlaying)) {
          return;
        }

        const moves = [];
        const merges = [];
        let changed = false;

        for (let lineIndex = 0; lineIndex < 4; lineIndex++) {
          const line = this.getLine(
            direction, lineIndex
          );

          let targetIndex = 0;

          for (let i = 0; i < line.length; i++) {
            const tile = line[i];
            const next = line[i + 1];

            const target = this.targetPosition(
              direction, lineIndex, targetIndex
            );

            if (tile.row !== target.row ||
                tile.col !== target.col) {
              changed = true;
            }

            moves.push({ tile, ...target });

            if (next && tile.value === next.value) {
              moves.push({ tile: next, ...target });
              merges.push({ tile, other: next });
              changed = true;
              i++;
            }

            targetIndex++;
          }
        }

        if (!changed) return;

        this.previous = {
          tiles: this.tiles.map(tile => ({
            row: tile.row,
            col: tile.col,
            value: tile.value
          })),
          score: this.score,
          won: this.won,
          keepPlaying: this.keepPlaying
        };

        this.busy = true;
        const currentGeneration = this.generation;

        // Phase 1: Slide existing tiles.
        for (const move of moves) {
          move.tile.row = move.row;
          move.tile.col = move.col;
          this.setPosition(move.tile);
        }

        // Phase 2: Merge after movement finishes.
        setTimeout(() => {
          if (currentGeneration !== this.generation) {
            return;
          }

          const removed = new Set();

          for (const { tile, other } of merges) {
            removed.add(other.id);
            other.node.remove();

            tile.value *= 2;
            this.score += tile.value;

            this.styleTile(tile);

            tile.node.classList.remove("merge");

            // Restart the merge animation.
            void tile.node.offsetWidth;
            if (this.duration > 0) {
              tile.node.classList.add("merge");
            }
          }

          this.tiles = this.tiles.filter(
            tile => !removed.has(tile.id)
          );

          // Phase 3: Spawn the next tile.
          this.spawnTile(true);
          this.updateScore();

          this.busy = false;

          if (!this.won &&
              this.tiles.some(t => t.value >= 2048)) {
            this.won = true;
            this.pendingDirection = null;

            setTimeout(() => {
              if (currentGeneration === this.generation &&
                  this.won && !this.keepPlaying) {
                this.showOverlay(
                  "You Win!",
                  "Keep Playing",
                  () => {
                    this.keepPlaying = true;
                  }
                );
              }
            }, 260);

          } else if (!this.canMove()) {
            this.over = true;
            this.pendingDirection = null;

            setTimeout(() => {
              if (currentGeneration === this.generation &&
                  this.over) {
                this.showOverlay(
                  "Game Over",
                  "Try Again",
                  () => this.newGame()
                );
              }
            }, 260);

          } else if (this.pendingDirection) {
            const next = this.pendingDirection;
            this.pendingDirection = null;
            this.move(next);
          }
        }, this.duration + 10);
      }

      showOverlay(title, buttonText, callback) {
        this.boardEl.querySelector(".overlay")?.remove();

        const overlay = document.createElement("div");
        const heading = document.createElement("div");
        const button = document.createElement("button");

        overlay.className = "overlay";
        heading.textContent = title;
        button.textContent = buttonText;

        button.addEventListener("click", () => {
          overlay.remove();
          callback();
        });

        overlay.append(heading, button);
        this.boardEl.appendChild(overlay);
      }

      undo() {
        if (this.busy || !this.previous) return;

        const saved = this.previous;
        this.previous = null;
        this.generation++;
        this.pendingDirection = null;

        this.score = saved.score;
        this.won = saved.won;
        this.keepPlaying = saved.keepPlaying;
        this.over = false;

        this.drawBackground();

        this.tiles = saved.tiles.map(tile => ({
          ...tile,
          id: ++this.nextId,
          node: null
        }));

        this.tiles.forEach(tile =>
          this.createTile(tile, false)
        );

        this.updateScore();
      }

      resize() {
        if (this.busy) return;

        this.boardEl.style.setProperty(
          "--cell-size",
          `${this.cellSize}px`
        );

        this.boardEl.querySelectorAll(".cell")
          .forEach((cell, index) => {
            const row = Math.floor(index / 4);
            const col = index % 4;
            const { x, y } = this.position(row, col);

            cell.style.left = `${x}px`;
            cell.style.top = `${y}px`;
          });

        for (const tile of this.tiles) {
          this.styleTile(tile);
          this.setPosition(tile);
        }
      }

      bindEvents() {
        document.getElementById("restart")
          .addEventListener("click", () => this.newGame());

        document.getElementById("undo")
          .addEventListener("click", () => this.undo());

        const keyMap = {
          ArrowUp: "up",
          ArrowDown: "down",
          ArrowLeft: "left",
          ArrowRight: "right",
          w: "up",
          a: "left",
          s: "down",
          d: "right"
        };

        document.addEventListener("keydown", event => {
          if (event.ctrlKey || event.altKey ||
              event.metaKey) return;

          const direction =
            keyMap[event.key] ||
            keyMap[event.key.toLowerCase()];

          if (!direction) return;

          event.preventDefault();
          this.move(direction);
        });

        let touchStart = null;

        this.boardEl.addEventListener(
          "touchstart",
          event => {
            touchStart = {
              x: event.touches[0].clientX,
              y: event.touches[0].clientY
            };
          },
          { passive: true }
        );

        this.boardEl.addEventListener(
          "touchend",
          event => {
            if (!touchStart) return;

            const dx =
              event.changedTouches[0].clientX -
              touchStart.x;

            const dy =
              event.changedTouches[0].clientY -
              touchStart.y;

            touchStart = null;

            if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) {
              return;
            }

            const direction =
              Math.abs(dx) > Math.abs(dy)
                ? (dx > 0 ? "right" : "left")
                : (dy > 0 ? "down" : "up");

            this.move(direction);
          },
          { passive: true }
        );

        if (typeof ResizeObserver !== "undefined") {
          new ResizeObserver(() => this.resize())
            .observe(this.boardEl);
        }
      }
    }

    new Game2048();
  </script>
</body>
</html>
