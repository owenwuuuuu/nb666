
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Smooth Edition</title>
<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #faf8f5;
  font-family: Arial, sans-serif;
  color: #333;
  display: flex;
  align-items: center;
  justify-content: center;
}

.game {
  width: min(92vw, 420px);
  padding: 25px 0;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

h1 {
  font-size: 54px;
  letter-spacing: -3px;
  margin: 0;
}

h1 span {
  color: #d5a45e;
}

.subtitle {
  font-size: 12px;
  color: #999;
}

.scores {
  display: flex;
  gap: 8px;
}

.score-box {
  background: white;
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 9px 14px;
  min-width: 82px;
  text-align: center;
}

.score-box small {
  display: block;
  color: #999;
  font-size: 11px;
}

.score-box strong {
  font-size: 23px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

.toolbar p {
  font-size: 13px;
  color: #888;
}

button {
  background: white;
  border: 1px solid #e5e0d9;
  border-radius: 12px;
  padding: 10px 14px;
  cursor: pointer;
  font-weight: bold;
  color: #555;
}

button:hover {
  background: #f1ece6;
}

button:active {
  transform: scale(0.96);
}

.board {
  position: relative;
  width: 100%;
  aspect-ratio: 1 / 1;
  background: #b9ada0;
  border-radius: 22px;
  overflow: hidden;
  touch-action: none;
  user-select: none;
}

.cell {
  position: absolute;
  background: #cdc2b5;
  border-radius: 15px;
}

.tile {
  position: absolute;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 15px;
  font-weight: 800;
  box-shadow: 0 2px 4px #5a463018;
  will-change: transform;

  transition:
    transform 155ms cubic-bezier(.2,.8,.25,1);
}

.tile .face {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
}

.tile.pop .face {
  animation: pop 230ms ease-out;
}

.tile.spawn .face {
  animation: appear 220ms ease-out;
}

@keyframes pop {
  0% {
    transform: scale(1);
  }
  45% {
    transform: scale(1.18);
  }
  100% {
    transform: scale(1);
  }
}

@keyframes appear {
  0% {
    transform: scale(0.35);
    opacity: 0;
  }
  75% {
    transform: scale(1.07);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(250,248,239,.87);
  border-radius: 22px;
  z-index: 30;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 15px;
  font-size: 28px;
  font-weight: bold;
}

.overlay button {
  background: #8f7a66;
  color: white;
}

.footer {
  text-align: center;
  font-size: 12px;
  color: #aaa;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="game">
  <header>
    <div>
      <h1>2048<span>.</span></h1>
      <div class="subtitle">Smooth Edition</div>
    </div>

    <div class="scores">
      <div class="score-box">
        <small>当前分数</small>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <small>最高分</small>
        <strong id="best">0</strong>
      </div>
    </div>
  </header>

  <div class="toolbar">
    <p>合并数字，挑战 2048</p>
    <div>
      <button id="undo">撤销</button>
      <button id="restart">重新开始</button>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="footer">
    方向键 / WASD 移动 · 手机滑动操作
  </div>
</div>

<script>
const boardEl = document.getElementById("board");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");

const GAP = 9;
const PAD = 9;
const MOVE_TIME = 155;

const colors = {
  2: ["#eee4da", "#776e65"],
  4: ["#ede0c8", "#776e65"],
  8: ["#f2b179", "#fff"],
  16: ["#f59563", "#fff"],
  32: ["#f67c5f", "#fff"],
  64: ["#f65e3b", "#fff"],
  128: ["#edcf72", "#fff"],
  256: ["#edcc61", "#fff"],
  512: ["#edc850", "#fff"],
  1024: ["#edc53f", "#fff"],
  2048: ["#edc22e", "#fff"]
};

let tiles = [];
let score = 0;
let best = 0;
let previous = null;
let busy = false;
let won = false;
let ended = false;
let sequence = 0;
let cellSize = 0;

try {
  best = Number(localStorage.getItem("2048-smooth-best")) || 0;
} catch (e) {}

function calculateSize() {
  cellSize = (boardEl.clientWidth - PAD * 2 - GAP * 3) / 4;
}

function getPosition(row, col) {
  return {
    x: PAD + col * (cellSize + GAP),
    y: PAD + row * (cellSize + GAP)
  };
}

function setPosition(node, row, col) {
  const { x, y } = getPosition(row, col);
  node.style.transform = `translate(${x}px, ${y}px)`;
}

function styleTile(tile) {
  const node = tile.node;
  const [background, color] =
    colors[tile.value] || ["#3c3a32", "#fff"];

  node.style.background = background;
  node.style.color = color;

  node.style.fontSize =
    tile.value >= 1024 ? cellSize * 0.27 + "px" :
    tile.value >= 128 ? cellSize * 0.34 + "px" :
    cellSize * 0.43 + "px";

  node.querySelector(".face").textContent = tile.value;
}

function createTile(tile, animated = false) {
  const node = document.createElement("div");
  node.className = "tile" + (animated ? " spawn" : "");

  node.style.width = cellSize + "px";
  node.style.height = cellSize + "px";
  node.style.left = "0";
  node.style.top = "0";

  const face = document.createElement("div");
  face.className = "face";
  node.appendChild(face);

  tile.node = node;

  styleTile(tile);
  setPosition(node, tile.row, tile.col);

  boardEl.appendChild(node);

  if (animated) {
    setTimeout(() => node.classList.remove("spawn"), 250);
  }
}

function addRandomTile(animated = true) {
  const occupied = new Set(
    tiles.map(t => t.row * 4 + t.col)
  );

  const empty = [];

  for (let i = 0; i < 16; i++) {
    if (!occupied.has(i)) empty.push(i);
  }

  if (!empty.length) return;

  const index = empty[Math.floor(Math.random() * empty.length)];

  const tile = {
    id: ++sequence,
    row: Math.floor(index / 4),
    col: index % 4,
    value: Math.random() < 0.9 ? 2 : 4
  };

  tiles.push(tile);
  createTile(tile, animated);
}

function updateScores() {
  scoreEl.textContent = score;

  if (score > best) {
    best = score;
    try {
      localStorage.setItem("2048-smooth-best", best);
    } catch (e) {}
  }

  bestEl.textContent = best;
}

function drawBoard() {
  calculateSize();

  boardEl.innerHTML = "";

  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 4; col++) {
      const cell = document.createElement("div");
      cell.className = "cell";

      const { x, y } = getPosition(row, col);

      cell.style.width = cellSize + "px";
      cell.style.height = cellSize + "px";
      cell.style.left = x + "px";
      cell.style.top = y + "px";

      boardEl.appendChild(cell);
    }
  }
}

function startGame() {
  tiles = [];
  score = 0;
  previous = null;
  busy = false;
  won = false;
  ended = false;

  drawBoard();

  addRandomTile(false);
  addRandomTile(false);

  updateScores();
}

function canMove() {
  const grid = Array(16).fill(0);

  tiles.forEach(t => {
    grid[t.row * 4 + t.col] = t.value;
  });

  if (grid.includes(0)) return true;

  return grid.some((value, index) => {
    return (
      (index % 4 < 3 && grid[index + 1] === value) ||
      (index < 12 && grid[index + 4] === value)
    );
  });
}

function showOverlay(text, buttonText, callback) {
  const overlay = document.createElement("div");
  overlay.className = "overlay";

  const title = document.createElement("div");
  title.textContent = text;

  const button = document.createElement("button");
  button.textContent = buttonText;

  button.onclick = () => {
    overlay.remove();
    callback();
  };

  overlay.append(title, button);
  boardEl.appendChild(overlay);
}

function move(direction) {
  if (busy || won || ended) return;

  const moves = [];
  const merges = [];
  let changed = false;

  for (let k = 0; k < 4; k++) {
    const horizontal =
      direction === "left" || direction === "right";

    const line = tiles
      .filter(t => (horizontal ? t.row : t.col) === k)
      .sort((a, b) => {
        if (direction === "left") return a.col - b.col;
        if (direction === "right") return b.col - a.col;
        if (direction === "up") return a.row - b.row;
        return b.row - a.row;
      });

    let target = 0;

    for (let i = 0; i < line.length; i++) {
      const tile = line[i];
      const other = line[i + 1];

      const shouldMerge =
        other && tile.value === other.value;

      const row = horizontal
        ? k
        : direction === "up" ? target : 3 - target;

      const col = horizontal
        ? direction === "left" ? target : 3 - target
        : k;

      if (tile.row !== row || tile.col !== col) {
        changed = true;
      }

      moves.push({ tile, row, col });

      if (shouldMerge) {
        moves.push({ tile: other, row, col });
        merges.push({ tile, other });
        changed = true;
        i++;
      }

      target++;
    }
  }

  if (!changed) return;

  previous = {
    tiles: tiles.map(t => ({
      row: t.row,
      col: t.col,
      value: t.value
    })),
    score
  };

  busy = true;

  // 第一阶段：方块滑动到目标位置
  moves.forEach(({ tile, row, col }) => {
    tile.row = row;
    tile.col = col;
    setPosition(tile.node, row, col);
  });

  // 第二阶段：滑动结束后才执行合并
  setTimeout(() => {
    const removed = new Set();

    merges.forEach(({ tile, other }) => {
      removed.add(other.id);
      other.node.remove();

      tile.value *= 2;
      score += tile.value;

      styleTile(tile);

      // 重新触发弹跳动画
      tile.node.classList.remove("pop");
      void tile.node.offsetWidth;
      tile.node.classList.add("pop");
    });

    tiles = tiles.filter(t => !removed.has(t.id));

    // 第三阶段：新方块渐显
    addRandomTile(true);
    updateScores();

    busy = false;

    if (!won && tiles.some(t => t.value >= 2048)) {
      won = true;

      setTimeout(() => {
        showOverlay("你赢了！", "继续挑战", () => {
          won = false;
        });
      }, 280);

    } else if (!canMove()) {
      ended = true;

      setTimeout(() => {
        showOverlay("游戏结束", "再玩一次", startGame);
      }, 280);
    }
  }, MOVE_TIME + 10);
}

function undo() {
  if (busy || !previous) return;

  const saved = previous;
  previous = null;

  score = saved.score;
  won = false;
  ended = false;

  drawBoard();

  tiles = saved.tiles.map(t => ({
    ...t,
    id: ++sequence
  }));

  tiles.forEach(t => createTile(t));

  updateScores();
}

function resizeBoard() {
  if (busy) return;

  calculateSize();

  boardEl.querySelectorAll(".cell").forEach((cell, i) => {
    const row = Math.floor(i / 4);
    const col = i % 4;
    const { x, y } = getPosition(row, col);

    cell.style.width = cellSize + "px";
    cell.style.height = cellSize + "px";
    cell.style.left = x + "px";
    cell.style.top = y + "px";
  });

  tiles.forEach(tile => {
    tile.node.style.width = cellSize + "px";
    tile.node.style.height = cellSize + "px";
    styleTile(tile);
    setPosition(tile.node, tile.row, tile.col);
  });
}

document.getElementById("restart").onclick = startGame;
document.getElementById("undo").onclick = undo;

document.addEventListener("keydown", event => {
  const directions = {
    ArrowUp: "up",
    ArrowDown: "down",
    ArrowLeft: "left",
    ArrowRight: "right",
    w: "up",
    a: "left",
    s: "down",
    d: "right",
    W: "up",
    A: "left",
    S: "down",
    D: "right"
  };

  const direction = directions[event.key];

  if (direction) {
    event.preventDefault();
    move(direction);
  }
});

let touchX = 0;
let touchY = 0;

boardEl.addEventListener("touchstart", event => {
  touchX = event.touches[0].clientX;
  touchY = event.touches[0].clientY;
}, { passive: true });

boardEl.addEventListener("touchend", event => {
  const dx = event.changedTouches[0].clientX - touchX;
  const dy = event.changedTouches[0].clientY - touchY;

  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;

  if (Math.abs(dx) > Math.abs(dy)) {
    move(dx > 0 ? "right" : "left");
  } else {
    move(dy > 0 ? "down" : "up");
  }
}, { passive: true });

if (typeof ResizeObserver !== "undefined") {
  new ResizeObserver(resizeBoard).observe(boardEl);
}

startGame();
</script>
</body>
</html>
